<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gestione Casa Montagna</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; color: #f8fafc;
      overflow: hidden;
    }
    
    /* Contenitore e iframe a schermo intero senza barre */
    #appFrame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 28px; border-radius: 20px; max-width: 400px; width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center;
      z-index: 10;
    }
    h2 { margin-top: 0; font-size: 1.25rem; }
    p { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    input[type="url"] {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0f172a; color: white; font-size: 0.9rem; margin-bottom: 16px; outline: none;
    }
    input[type="url"]:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Iframe che conterrà Google Sites rimanendo dentro il dominio GitHub -->
  <iframe id="appFrame" allow="geolocation; microphone; camera"></iframe>

  <!-- Schermata di configurazione (mostrata solo al primo avvio) -->
  <div id="setupScreen" class="card" style="display: none;">
    <h2>🏔️ Configura Casa Montagna</h2>
    <p>Inserisci l'URL del tuo Google Sites per collegare l'applicazione a tutto schermo.</p>
    <input type="url" id="scriptUrlInput" placeholder="https://sites.google.com/view/..." required>
    <button onclick="saveUrlAndLoad()">Salva e Apri App</button>
  </div>

  <script>
    const STORAGE_KEY = 'casa_montagna_apps_script_url';

    function loadApp(url) {
      const frame = document.getElementById('appFrame');
      frame.src = url;
      frame.style.display = 'block';
      document.getElementById('setupScreen').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem(STORAGE_KEY);
      if (savedUrl) {
        loadApp(savedUrl);
      } else {
        document.getElementById('setupScreen').style.display = 'block';
      }
    });

    function saveUrlAndLoad() {
      const input = document.getElementById('scriptUrlInput');
      const url = input.value.trim();

      if (!url || !url.startsWith('http')) {
        alert('Inserisci un URL valido (deve iniziare con https://)');
        return;
      }

      localStorage.setItem(STORAGE_KEY, url);
      loadApp(url);
    }
  </script>
</body>
</html>
