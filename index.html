<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestione Casa Montagna</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; color: #f8fafc;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 28px; border-radius: 20px; max-width: 400px; width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center;
    }
    h2 { margin-top: 0; font-size: 1.25rem; }
    p { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    input[type="url"] {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0f172a; color: white; font-size: 0.9rem; margin-bottom: 16px; outline: none;
    }
    input[type="url"]:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-bottom: 8px;
    }
    .reset-btn {
      background: transparent; border: none; color: #64748b; font-size: 0.75rem;
      cursor: pointer; text-decoration: underline; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="setupScreen" class="card">
    <h2>🏔️ Configura Casa Montagna!</h2>
    <p>Inserisci l'URL della tua Web App di Google Apps Script per collegare l'applicazione.</p>
    <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/..." required>
    <button onclick="saveUrlAndRedirect()">Salva e Apri App</button>
  </div>

  <div id="loadingScreen" class="card" style="display: none;">
    <h2>🏔️ Casa Montagna</h2>
    <p>Apertura in corso...</p>
    <button class="reset-btn" onclick="clearSavedUrl()">⚙️ Modifica URL salvato</button>
  </div>

  <script>
    const STORAGE_KEY = 'casa_montagna_apps_script_url';

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem(STORAGE_KEY);
      if (savedUrl) {
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('loadingScreen').style.display = 'block';
        window.location.replace(savedUrl);
      }
    });

    function saveUrlAndRedirect() {
      const input = document.getElementById('scriptUrlInput');
      const url = input.value.trim();

      if (!url || !url.startsWith('https://script.google.com/')) {
        alert('Inserisci un URL valido di Google Apps Script (deve iniziare con https://script.google.com/)');
        return;
      }

      localStorage.setItem(STORAGE_KEY, url);
      window.location.replace(url);
    }

    function clearSavedUrl() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  </script>
</body>
</html>
