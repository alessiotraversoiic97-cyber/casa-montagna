<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestione Casa Montagna</title>
  
  <!-- Configurazione PWA per consentire l'installazione su Schermata Home -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; color: #f8fafc;
    }
    #appFrame {
      width: 100%; height: 100%; border: none; display: none;
    }
    .setup-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; padding: 24px; text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px; border-radius: 20px; max-width: 400px; width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); backdrop-filter: blur(10px);
    }
    h2 { margin-top: 0; font-size: 1.25rem; }
    p { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    input[type="url"] {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0f172a; color: white; font-size: 0.9rem; margin-bottom: 16px; outline: none;
    }
    input[type="url"]:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white;
      font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .reset-bar {
      position: fixed; bottom: 10px; right: 10px; z-index: 999; display: none;
    }
    .reset-btn {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8; font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Schermata di primo inserimento URL -->
  <div id="setupScreen" class="setup-container">
    <div class="card">
      <h2>🏔️ Configura Casa Montagna</h2>
      <p>Inserisci una sola volta l'URL della tua Web App di Google Apps Script per collegare l'applicazione.</p>
      <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/..." required>
      <button onclick="saveUrlAndLoad()">Salva e Apri App</button>
    </div>
  </div>

  <!-- Frame a schermo intero per l'applicazione -->
  <iframe id="appFrame" src="" allow="geolocation; microphone; camera"></iframe>

  <!-- Pulsante piccolo in basso a destra per reimpostare l'URL se necessario -->
  <div id="resetBar" class="reset-bar">
    <button class="reset-btn" onclick="clearSavedUrl()">⚙️ Modifica URL</button>
  </div>

  <script>
    const STORAGE_KEY = 'casa_montagna_apps_script_url';

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem(STORAGE_KEY);
      if (savedUrl) {
        loadApp(savedUrl);
      }
    });

    function saveUrlAndLoad() {
      const input = document.getElementById('scriptUrlInput');
      const url = input.value.trim();

      if (!url || !url.startsWith('https://script.google.com/')) {
        alert('Inserisci un URL valido di Google Apps Script (deve iniziare con https://script.google.com/)');
        return;
      }

      localStorage.setItem(STORAGE_KEY, url);
      loadApp(url);
    }

    function loadApp(url) {
      document.getElementById('setupScreen').style.display = 'none';
      const frame = document.getElementById('appFrame');
      frame.src = url;
      frame.style.display = 'block';
      document.getElementById('resetBar').style.display = 'block';
    }

    function clearSavedUrl() {
      if (confirm('Vuoi rimuovere l\'URL salvato e ripristinare la configurazione?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }
  </script>
</body>
</html>
